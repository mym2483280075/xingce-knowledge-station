/* 【易错】找不到 id 时静默返回 SECTIONS[0]（常识判断）：好处是不会白屏，
   坏处是“id 拼错”会表现为“跳到了对的板块”，排查时很容易被误导。
   新增板块或改 id 后，请顺手点一遍侧栏每一项确认标题/计数都对。 */
function getSection(id){ for(var i=0;i<SECTIONS.length;i++){ if(SECTIONS[i].id===id) return SECTIONS[i]; } return SECTIONS[0]; }

/* ================= 侧边栏渲染 ================= */

(function(){
  var html = '', lastGrp = '';
  SECTIONS.forEach(function(s){
    var g = s.grp || '六大板块';
    if(g !== lastGrp){ html += '<div class="group">' + g + '</div>'; lastGrp = g; }
    html += '<button class="nav-item" data-id="'+s.id+'" style="--c:'+s.color+'">'+
      '<span class="ico"></span>'+
      '<span class="txt"><span class="nm"><span class="cn">'+s.name+'</span></span></span>'+
      '<span class="cnt">'+s.cnt+'</span></button>';
  });
  nav.innerHTML = html;
})();

/* 侧边栏点击切换 */
nav.addEventListener('click', function(e){
  var item = e.target.closest('.nav-item');
  if(item){ openSection(item.getAttribute('data-id'), null); }

/* ================= iframe 与切换 ================= */
var frame = document.getElementById('frame');
var crumbBar = document.getElementById('crumbBar');
var crumbTitle = document.getElementById('crumbTitle');
var crumbEn = document.getElementById('crumbEn');
var curId = null;
var pendingQuery = null;
/* 板块页版本号：只在“本次部署有内容更新”时改这里，平时让浏览器直接用缓存（走 ETag 校验），
   不再用 Date.now()，否则每次切换板块都要重新下载整份 HTML（最大 1.2MB）。
   【易错】【需求】改这个版本号时，别忘了同时改各板块页里 assets/演算层.js?v=...：
   两者共同决定 iPad 上看到的到底是新代码还是缓存里的旧代码。
   （2026-09-14 重构 sections/言语理解.html 的 800 词库：由「8 讲」改为「77 组」，
     两处版本号同时升到 v20260914a。）
   （2026-09-14 新增 assets/定位层.js 修目录跳转落点：10 个板块页都插了新的
     <script ...定位层.js?v=20260914a>，所以这里必须再升到 v20260914b，
     否则 iPad 会继续用缓存里的旧板块页 HTML，定位层的 <script> 根本不会被加载。） */
var CACHE_V = 'v20260914b';

/* 【易错】切换板块后要把待发的搜索转发给新页面：必须等 iframe 的 load 事件再 postMessage，
   抢在前面发会被丢弃（目标页还没绑定监听）。pendingQuery 就是为这个“等一手”存在的，别删。 */
frame.addEventListener('load', function(){
  if(pendingQuery != null){
    try{
      frame.contentWindow.postMessage({type:'ws-search', q: pendingQuery.q, id: pendingQuery.id}, '*');
    }catch(e){}
    pendingQuery = null;
  }
});

function setActive(id){
  curId = id;
  var items = nav.querySelectorAll('.nav-item');
  for(var i=0;i<items.length;i++){
    items[i].classList.toggle('active', items[i].getAttribute('data-id')===id);
  }
}

/* query: 字符串(兼容旧调用) 或 {q, id}；id 为目标知识点/单元锚点 */
/* 【易错】openSection 是导航的唯一入口，两处细节别动：
   ① changed 判定看 iframe 上的 data-cur（当前已加载的板块），只有真的换板块才重设 src，
      否则每次点击都会重载整份板块页（最大 1.2MB）；
   ② 搜索跳转必须“先改 src、再把查询挂到 pendingQuery”，等 load 后由上面的监听转发。
   这里还负责更新面包条颜色/标题、窄屏自动收起侧栏，改动时留意这几步的先后顺序。 */
function openSection(id, query){
  var s = getSection(id);
  var norm;
  if(query == null){ norm = null; }
  else if(typeof query === 'string'){ norm = {q: query, id: null}; }
  else { norm = {q: (query.q||''), id: (query.id||null)}; }
  var changed = (frame.getAttribute('data-cur') !== id);
  frame.setAttribute('data-cur', id);
  if(changed){ frame.src = s.file + '?' + CACHE_V; }
  if(norm && norm.q){
    var send = function(){
      try{ frame.contentWindow.postMessage({type:'ws-search', q: norm.q, id: norm.id}, '*'); }catch(e){}
    };
    if(changed){ pendingQuery = norm; } else { send(); }
  }
  setActive(id);
  crumbBar.style.background = s.color;
  crumbTitle.textContent = s.name;
  crumbEn.textContent = s.en;
  if(window.innerWidth <= 860){ closeSidebar(); }
}

/* 移动端侧边栏开关（带遮罩，点遮罩也能收起） */
var sidebarEl = document.getElementById('sidebar');
var backdropEl = document.getElementById('backdrop');
function openSidebar(){ sidebarEl.classList.add('open'); backdropEl.classList.add('show'); }
function closeSidebar(){ sidebarEl.classList.remove('open'); backdropEl.classList.remove('show'); }

/* ================= 全局搜索 ================= */
var globalQ = document.getElementById('globalQ');
var drop = document.getElementById('drop');

function findMatches(q){
  var out = [];
  SECTIONS.forEach(function(s){
    s.keywords.forEach(function(k){
      if(q && k.indexOf(q) > -1){ out.push({sec:s, kw:k}); }
    });
  });
  // 去重，保留最长关键词
  var seen = {};
  var uniq = [];
  out.forEach(function(m){
    var key = m.sec.id + '::' + m.kw;
    if(!seen[key]){ seen[key]=1; uniq.push(m); }
  });
  uniq.sort(function(a,b){ return b.kw.length - a.kw.length; });
  return uniq.slice(0, 8);
}

function renderDrop(matches){
  if(!matches || !matches.length){
    drop.innerHTML = '<div class="empty">未找到匹配知识点，可输入板块名或直接浏览侧边栏</div>';
    drop.classList.add('show');
    return;
  }
  drop.innerHTML = '<div class="ghead">板块关键词命中</div>' + matches.map(function(m){
    return '<div class="row" data-id="'+m.sec.id+'" data-q="'+m.kw+'" style="--c:'+m.sec.color+'">'+
      '<span class="dot"></span><div><div class="t1">'+m.sec.name+' · '+m.kw+'</div>'+
      '<div class="t2">'+m.sec.sub+'</div></div></div>';
  }).join('');
  drop.classList.add('show');
  Array.prototype.forEach.call(drop.querySelectorAll('.row'), function(r){
    r.addEventListener('click', function(){
      openSection(r.getAttribute('data-id'), {q: r.getAttribute('data-q'), id: r.getAttribute('data-a')||null});
      drop.classList.remove('show');
      globalQ.blur();
    });
  });
}

/* ===== 全文模糊搜索（GitHub 成熟方案 Fuse.js v7，CDN 加载；不可用时自动降级关键词检索） ===== */
var wsData = null, wsFuse = null, wsFuseBusy = false;

/* 【易错】凡是把内容拼进 innerHTML 的地方都必须先过这里（索引正文来自各板块页，
   查询词来自用户输入）——少一处就可能出现排版错乱或注入问题。 */
function wsEsc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function wsSnippet(it, q){
  /* 【易错】索引正文（it.x）抄自各板块页的纯文本，里面可能原样带着 < > & 这些字符，
     拼进 innerHTML 之前必须整段转义。原先只转义了命中词与尾段，pre 与“没命中时”
     的那一句是裸露的 —— 一旦正文里有裸 < 或 &，结果面板就可能排版错乱甚至被截断。 */
  var idx = it.x.indexOf(q);
  if(idx < 0){ return wsEsc(it.x.slice(0, 42)); }
  var a = idx - 14; if(a < 0){ a = 0; }
  var pre = (a > 0 ? '…' : '') + wsEsc(it.x.slice(a, idx));
  var hit = it.x.slice(idx, idx + q.length);
  var tail = it.x.slice(idx + q.length, idx + q.length + 26) + (idx + q.length < it.x.length ? '…' : '');
  return pre + '<b>' + wsEsc(hit) + '</b>' + wsEsc(tail);
}
/* 【坑】【需求】全文搜索的三段式保障（用户要求离线也能用）：
   ① 先取本地索引 search-index.json（构建脚本产出）；
   ② 再动态 import CDN 上的 Fuse.js（jsdelivr → unpkg 依次兜底）；
   ③ 任何一步失败都只能降级为“关键词命中”，绝不能抛错拦住搜索框。
   所以这里用 catch 兜住并让 wsFuse 保持 null —— renderSearch 会据此走关键词分支。
   改 CDN 地址或 Fuse 版本时，注意 keys 权重与 threshold 会直接影响命中排序。 */
function initGlobalSearch(){
  if(wsFuseBusy || window.fetch == null){ return; }
  wsFuseBusy = true;
  fetch('assets/search-index.json').then(function(r){
    if(!r.ok){ throw new Error('no index'); }
    return r.json();
  }).then(function(d){
    wsData = d;
    var cdn = [
      'https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.basic.min.mjs',
      'https://unpkg.com/fuse.js@7.0.0/dist/fuse.basic.min.mjs'
    ];
    var chain = Promise.reject();
    cdn.forEach(function(u){ chain = chain.catch(function(){ return import(u); }); });
    return chain.catch(function(){ return null; });
  }).then(function(mod){
    if(mod && wsData && wsData.items){
      wsFuse = new mod.default(wsData.items, {
        includeScore: true, includeMatches: true,
        threshold: 0.35, ignoreLocation: true,
        keys: [{ name: 't', weight: 2 }, { name: 'n', weight: 1 }, { name: 'x', weight: 1 }]
      });
    }
  }).catch(function(){ wsFuse = null; });
}

/* 【易错】两条搜索分支必须保持行为一致：
   有 Fuse 时走“全文模糊搜索”（点结果 → 直达知识点锚点 data-a）；
   没有 Fuse 时走 renderDrop（关键词命中，只到板块）。
   任何一条分支里新加的 DOM 拼接都要 wsEsc 转义，并且都要给 .row 绑点击。 */
function renderSearch(q){
  q = (q||'').trim();
  if(!q){ drop.classList.remove('show'); return; }
  if(wsFuse && wsData){
    var res;
    try{ res = wsFuse.search(q, { limit: 10 }); }catch(e){ res = []; }
    if(!res.length){
      drop.innerHTML = '<div class="empty">正文中未找到与「'+wsEsc(q)+'」相关的内容，可换个关键词试试</div>';
      drop.classList.add('show');
      return;
    }
    drop.innerHTML = '<div class="ghead">全文模糊搜索 · 命中 '+res.length+' 条（点击直达）</div>' + res.map(function(r){
      var it = r.item;
      var sec = getSection(it.s);
      return '<div class="row" data-id="'+wsEsc(it.s)+'" data-q="'+wsEsc(q)+'" data-a="'+wsEsc(it.i||'')+'" style="--c:'+(sec?sec.color:'#4f7cff')+'">'+
        '<span class="dot"></span>'+
        '<div style="min-width:0"><div class="t1">'+wsEsc(it.n)+' · '+wsEsc(it.t)+'</div>'+
        '<div class="t2">'+wsSnippet(it, q)+'</div></div>'+
        '<span class="sc">'+wsEsc(it.n)+'</span></div>';
    }).join('');
    drop.classList.add('show');
    Array.prototype.forEach.call(drop.querySelectorAll('.row'), function(rr){
      rr.addEventListener('click', function(){
        openSection(rr.getAttribute('data-id'), {q: rr.getAttribute('data-q'), id: rr.getAttribute('data-a')||null});
        drop.classList.remove('show');
        globalQ.blur();
      });
    });
    return;
  }
  renderDrop(findMatches(q));
}

/* 【需求】搜索交互约定：输入即搜（不按回车也出结果）；回车取“最佳一条”直接跳转，
   取不到再退回结果面板；按 / 聚焦搜索框、Esc 收起结果——这三条是用户已习惯的键位。 */
globalQ.addEventListener('input', function(){
  renderSearch(this.value);
});
globalQ.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    var q = this.value.trim();
    if(!q) return;
    if(wsFuse){
      try{
        var r = wsFuse.search(q, { limit: 1 });
        if(r.length){
          openSection(r[0].item.s, {q: q, id: r[0].item.i||null});
          drop.classList.remove('show'); this.blur(); return;
        }
      }catch(e2){}
    }
    var best = routeBest(q);
    drop.classList.remove('show');
    if(best){ openSection(best.id, {q: q, id: null}); this.blur(); }
    else { renderSearch(q); }
  }
});
document.addEventListener('click', function(e){
  if(!e.target.closest('.searchbox')) drop.classList.remove('show');
});

/* ================= 助手已下线（2026-09 清理） ================= */

/* 【需求】回车兜底路由：索引还没加载好（或离线）时，用“关键词被包含在查询里”的方式
   选最长命中的那个板块。这是保证“回车永远有反应”的最后一道保险，别删。 */
function routeBest(q){
  var best = null, bestLen = 0;
  SECTIONS.forEach(function(s){
    s.keywords.forEach(function(k){
      if(q.indexOf(k) > -1 && k.length > bestLen){ bestLen = k.length; best = {id:s.id, kw:k}; }
    });
  });
  return best;
}

/* ================= 快捷键 & 移动端 ================= */
/* 【需求】快捷键与移动端：/ 聚焦搜索、Esc 收结果；菜单按钮切换侧栏，点遮罩也能收起，
   窗口变宽（>860）时自动收起侧栏，避免“桌面端残留抽屉状态”。 */
document.addEventListener('keydown', function(e){
  if(e.key==='/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
    e.preventDefault(); globalQ.focus();
  }
  if(e.key==='Escape'){ drop.classList.remove('show'); }
});
document.getElementById('menuBtn').addEventListener('click', function(){
  if(sidebarEl.classList.contains('open')) closeSidebar(); else openSidebar();
});
backdropEl.addEventListener('click', closeSidebar);
window.addEventListener('resize', function(){
  if(window.innerWidth > 860) closeSidebar();
});

/* ================= 显示模式（白天 / 夜晚 / 跟随系统） =================
   主题层 assets/主题.js 负责实际换肤；这里只做两件事：
   1) 把 iframe 交给主题层，切换时由主题层同步过去
   2) 接收板块页回传的状态，保持顶栏分段控件与内容页一致
   没有主题层时（脚本被拦截等）顶栏控件退化为不可用，不影响其它功能。 */
/* 【接口】与主题层的对接（assets/主题.js）：
   bindFrame 把 iframe 注册进主题层，之后切换主题会同步到内容页；
   下面的 message 监听接收板块页回传的 'xz-theme' 并 silent 应用（不能广播回去，会死循环）。
   主题层缺失时（脚本被拦截）这里会整体跳过，顶栏控件退化为不可用但不影响其它功能。 */
if(window.__xzTheme){
  try{ window.__xzTheme.bindFrame(frame); }catch(e){}
}
window.addEventListener('message', function(e){
  var d = e && e.data;
  if(d && d.type === 'xz-theme' && d.mode && window.__xzTheme){
    try{ window.__xzTheme.setMode(d.mode, true); }catch(e2){}
  }
});

/* ================= 初始化 ================= */
/* ================= 启动 ================= */
/* 【性能】检索索引 561KB：不做后台预热，只在用户点/输入搜索框时加载，
   首屏带宽全部留给板块内容；索引未就绪时回车仍可用关键词兜底路由。 */
var wsWarmed = false;
function warmIndex(){
  if(wsWarmed) return;
  wsWarmed = true;
  initGlobalSearch();
}
globalQ.addEventListener('focus', warmIndex);
globalQ.addEventListener('input', warmIndex);
openSection('cs', null);
</script>
