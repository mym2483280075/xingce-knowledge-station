<!DOCTYPE html>
<html lang="zh-CN" data-theme="mock">
<head><style id="xz-perf">/* 长页面打开提速：屏幕外的知识点块不做排版与绘制 */section.kp,section.unit{content-visibility:auto;contain-intrinsic-size:auto 700px}</style>
<meta charset="UTF-8">
<link rel="icon" href="data:,"><script src="../assets/%E6%BC%94%E7%AE%97%E5%B1%82.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>每周模考 · 行测知识工作站</title>
<style>
:root{
  --primary:#be185d; --primary2:#e11d48; --accent:#fb7185; --bg:#fbf2f6;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Hiragino Sans GB",sans-serif;color:#1f2937;background:var(--bg);line-height:1.8;font-size:15px}
header{background:linear-gradient(135deg,#831843 0%,var(--primary2) 62%,var(--accent) 135%);color:#fff;padding:32px 26px 26px;text-align:center}
header h1{margin:0;font-size:28px;letter-spacing:2px}
header .en{margin-top:4px;font-size:11.5px;letter-spacing:.24em;opacity:.82}
header .intro{margin:12px auto 0;max-width:880px;font-size:13px;opacity:.94;line-height:1.75}
header .meta{margin-top:13px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap;font-size:12px}
header .meta span{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:2px 13px}
.wrap{max-width:1080px;margin:22px auto 72px;padding:0 18px}
.block-title{display:flex;align-items:baseline;gap:10px;margin:6px 2px 14px}
.block-title h2{margin:0;font-size:20px;color:var(--primary)}
.block-title em{font-style:normal;font-size:12px;color:#9f1239;background:#ffe4ec;border-radius:999px;padding:1px 10px}
/* 期次卡片 */
.exam{border:1px solid #f4c2d3;border-radius:16px;background:#fff;padding:18px 20px 16px;margin-bottom:18px;box-shadow:0 4px 14px -12px rgba(190,24,93,.5)}
.exam-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.exam-top h3{margin:0;font-size:19px;color:var(--primary)}
.exam-top .no{font-size:11px;background:var(--primary2);color:#fff;border-radius:999px;padding:1px 10px;letter-spacing:.05em}
.exam-top .state{font-size:11.5px;color:#9f1239}
.exam-desc{font-size:12.5px;color:#6b7280;margin:2px 0 12px}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.part{border:1px solid #f0dbe3;border-radius:13px;padding:13px 15px;text-decoration:none;color:inherit;background:linear-gradient(180deg,#fff, #fdf3f7);transition:transform .12s,box-shadow .12s,border-color .12s;display:block}
.part:hover{transform:translateY(-2px);box-shadow:0 12px 24px -16px rgba(190,24,93,.6);border-color:var(--accent)}
.part b{display:flex;align-items:center;gap:7px;font-size:15.5px;color:var(--primary)}
.part b .pi{width:26px;height:26px;flex:none;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.part span{display:block;font-size:12px;color:#6b7280;margin-top:5px;line-height:1.6}
.part .cnt{display:inline-block;margin-top:8px;font-size:11px;color:#9f1239;background:#ffe4ec;border-radius:999px;padding:0 9px}
/* 指引 */
.guide{border:1px dashed var(--accent);border-radius:16px;background:#fffafb;padding:16px 20px;margin-top:6px}
.guide h3{margin:0 0 8px;font-size:15px;color:var(--primary)}
.guide ol{margin:0;padding-left:20px;font-size:13px;color:#4b5563}
.guide li{margin:3px 0}
.guide code{background:#ffe4ec;color:#9f1239;border-radius:5px;padding:0 6px;font-size:12px}
.guide .tpl{margin-top:10px;background:#fdf1f5;border:1px solid #f6d7e3;border-radius:10px;padding:8px 12px;font-size:12px;color:#7c3a5d;line-height:1.7}
.foot-tip{max-width:1080px;margin:0 auto 40px;padding:0 18px;font-size:11.5px;color:#a0939a}
@media(max-width:720px){ .wrap{padding:0 12px} .exam{padding:14px 14px 12px} }
/* ===== iOS 毛玻璃顶栏（统一设计） ===== */
body{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 10%,#fff) 0%,var(--bg) 46%,var(--bg) 100%)}
header{
  display:grid;grid-template-columns:46px 1fr;column-gap:14px;align-items:center;
  width:calc(100% - 36px);max-width:1044px;margin:16px auto 0;padding:20px 24px 18px;border-radius:24px;
  text-align:left;color:#0f172a;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.68));
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 24px 50px -34px rgba(15,23,42,.45);
}
header::before{
  content:"";grid-column:1;grid-row:1 / span 2;width:46px;height:46px;border-radius:50%;
  background:var(--primary2);
  -webkit-mask-image:radial-gradient(circle 18px at 50% 50%,#000 0%,rgba(0,0,0,.85) 30%,rgba(0,0,0,.40) 62%,rgba(0,0,0,.12) 86%,rgba(0,0,0,0) 100%);
  mask-image:radial-gradient(circle 18px at 50% 50%,#000 0%,rgba(0,0,0,.85) 30%,rgba(0,0,0,.40) 62%,rgba(0,0,0,.12) 86%,rgba(0,0,0,0) 100%);
}
header h1{grid-column:2;grid-row:1;margin:0;font-size:25px;font-weight:800;letter-spacing:.01em;color:#0f172a}
header .en{grid-column:2;grid-row:2;margin-top:3px;font-size:10.5px;font-weight:600;letter-spacing:.2em;opacity:1;color:color-mix(in srgb,var(--primary2) 55%,#7b8798)}
header .intro{grid-column:1 / -1;margin:16px 0 0;max-width:none;font-size:13px;opacity:1;color:#5b6675;line-height:1.75;text-align:left}
header .meta{grid-column:1 / -1;margin-top:13px;display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;font-size:12px}
header .meta span{background:color-mix(in srgb,var(--primary2) 10%,rgba(255,255,255,.8));border:1px solid color-mix(in srgb,var(--primary2) 16%,rgba(255,255,255,.7));border-radius:999px;padding:3px 12px;color:color-mix(in srgb,var(--primary) 55%,#3f4d63);font-weight:600}
@media(max-width:900px){header{grid-template-columns:40px 1fr;column-gap:12px;width:calc(100% - 24px);margin:12px auto 0;padding:18px 18px 16px;border-radius:20px}header::before{width:40px;height:40px;border-radius:50%;-webkit-mask-image:radial-gradient(circle 15px at 50% 50%,#000 0%,rgba(0,0,0,.85) 30%,rgba(0,0,0,.40) 62%,rgba(0,0,0,.12) 86%,rgba(0,0,0,0) 100%);mask-image:radial-gradient(circle 15px at 50% 50%,#000 0%,rgba(0,0,0,.85) 30%,rgba(0,0,0,.40) 62%,rgba(0,0,0,.12) 86%,rgba(0,0,0,0) 100%)}header h1{font-size:21px}}
@media print{body{background:#fff}}
/* ===== 顶部卡片：图标与板块名称同一行 · 整行居中 ===== */
header{--mc:#f43f5e;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:12px;row-gap:4px;text-align:center;padding:22px 24px 20px}
header::before{flex:none;margin:0}
header h1{flex:none;margin:0;max-width:100%;font-size:28px;font-weight:800;letter-spacing:.01em;color:color-mix(in srgb,var(--mc) 42%,#1e293b)}
header .en{flex:none;margin-top:0;max-width:100%}
header .intro{flex:1 0 100%;margin:16px auto 0;max-width:min(820px,100%);text-align:center}
header .meta{flex:1 0 100%;margin-top:14px;max-width:100%;justify-content:center}
@media(max-width:900px){header{column-gap:10px;padding:20px 18px 18px}header h1{font-size:23px}}
</style>
</head>
<body>
<header>
  <h1>每周模考</h1>
  <div class="intro">整卷模考的复盘归档中心：按「期次」分册，每期下设行测、申论、行测错题集合三大入口；行测与错题集合内按常识判断、政治理论、言语理解、数量关系、判断推理、资料分析六类分置题目。</div>
  <div class="meta">
    <span>当前 1 期</span>
    <span>一期三入口</span>
    <span>六分类分置</span>
    <span>支持续增期次</span>
  </div>
</header>
<div class="wrap" id="wrap"></div>

<script>
/* ================= 期次登记表 =================
   新增一期模考时：在本数组最前面 push 一项，并参照 9月7日模考 建立同名文件夹，
   内含 行测.html / 申论.html / 行测错题集合.html 三个页面即可自动出现在下方。
   命名规范：M月D日模考，例如 10月7日模考、11月20日模考。
   文件夹路径：sections/每周模考/<期次名>/                                      */
var MOCK_DATES = [
  { t:'9月7日模考', no:'第 1 期', desc:'2026 年 9 月 7 日整卷模考复盘。先补录行测六大分类题目，再做申论复盘，错题统一沉淀。' }
];

var SIX = [
  { c:'常识判断',  s:'文史 · 科技 · 经济 · 地理 · 法律' },
  { c:'政治理论',  s:'习思想 · 马克思主义基本原理' },
  { c:'言语理解',  s:'片段阅读 · 逻辑填空' },
  { c:'数量关系',  s:'数学运算 · 速算' },
  { c:'判断推理',  s:'图形 · 定义 · 类比 · 逻辑' },
  { c:'资料分析',  s:'统计材料 · 速算体系' }
];
var SIX_STR = SIX.map(function(x){ return x.c; }).join(' / ');

function render(){
  var html = '<div class="block-title"><h2>期次列表</h2><em>共 ' + MOCK_DATES.length + ' 期</em></div>';
  MOCK_DATES.forEach(function(m){
    html += '<div class="exam"><div class="exam-top"><h3>' + m.t + '</h3>' +
            '<span class="no">' + m.no + '</span><span class="state">行测申论已录入 · 答案点击展开</span></div>' +
            '<div class="exam-desc">' + m.desc + '</div><div class="parts">' +
            '<a class="part" href="每周模考/' + m.t + '/行测.html"><b><span class="pi">测</span>行测</b>' +
            '<span>整卷行测题目，按六大板块分类排布：' + SIX_STR + '。每题保留卷面原图，答案解析折叠于题下。</span><span class="cnt">130 题已录入</span></a>' +
            '<a class="part" href="每周模考/' + m.t + '/申论.html"><b><span class="pi">论</span>申论</b>' +
            '<span>申论整卷：给定资料原图 8 页 + 5 道大题题目原图，参考答案、评分标准与范文折叠于每题下方。</span><span class="cnt">5 大题已录入</span></a>' +
            '<a class="part" href="每周模考/' + m.t + '/行测错题集合.html"><b><span class="pi">错</span>行测错题集合</b>' +
            '<span>本卷错题按六大板块分类沉淀，每题记录错因与复盘。</span><span class="cnt">六分类空槽</span></a>' +
            '</div></div>';
  });
  html += '<div class="guide"><h3>如何新增一期模考（例如 10月7日模考、11月20日模考）</h3>' +
    '<ol><li>对工作站助手说「新增 10月7日模考」即可自动生成该期文件夹与三个页面；</li>' +
    '<li>或手动复制 <code>9月7日模考</code> 文件夹，改名为新期次（如 <code>10月7日模考</code>）后清空内容；</li>' +
    '<li>题图素材放入对应分类文件夹：<code>行测_assets/分类名/</code> 与 <code>行测错题集合_assets/分类名/</code>、<code>申论_assets/</code>；</li>' +
    '<li>在本页 <code>MOCK_DATES</code> 数组顶部 push 一条期次信息即可出现在上方列表中。</li></ol>' +
    '<div class="tpl">素材放置约定：每期目录下，行测_assets 与行测错题集合_assets 均内含常识判断/政治理论/言语理解/数量关系/判断推理/资料分析六个分类子文件夹，题目图片按题型放入后，再让助手写入对应页面（题目卡自带答案与解析，错题卡自带错因与复盘）。</div></div>';
  document.getElementById('wrap').innerHTML = html;
}
render();

/* 顶部全局搜索落点：进入本页后若有关键词，高亮期次卡片 */
window.addEventListener('message', function(e){
  var d = e.data || {};
  if(d.type === 'ws-search' && d.q){
    var q = String(d.q || '').trim();
    if(!q) return;
    document.querySelectorAll('.exam').forEach(function(card){
      var hit = card.textContent.indexOf(q) > -1;
      card.style.outline = hit ? '2px solid var(--primary2)' : '';
      card.style.background = hit ? '#fff5f8' : '#fff';
      if(hit){ card.scrollIntoView({ behavior:'smooth', block:'center' }); }
    });
  }
});
</script>
</body>
</html>
