<!DOCTYPE html>
<html lang="zh-CN" data-theme="mock">
<head><style id="xz-perf">/* 长页面打开提速：屏幕外的知识点块不做排版与绘制 */section.kp,section.unit{content-visibility:auto;contain-intrinsic-size:auto 700px}</style>
<meta charset="UTF-8">
<link rel="icon" href="data:,"><script src="../assets/%E4%B8%BB%E9%A2%98.js?v=20260922b"></script><script src="../assets/%E6%BC%94%E7%AE%97%E5%B1%82.js?v=20260922b"></script><script src="../assets/%E5%AE%9A%E4%BD%8D%E5%B1%82.js?v=20260922b"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>每周模考 · 公考工作站</title><link rel="stylesheet" href="../assets/design-tokens.css?v=20260920f"><link rel="stylesheet" href="../assets/%E6%9D%BF%E5%9D%97%E9%A1%B5%E6%A0%B7%E5%BC%8F.css?v=20260920f">
<style>
/* 本页专属样式（骨架与通用组件来自 assets/板块页样式.css，颜色一律走令牌） */
:root{--primary:#be185d; --primary2:#e11d48; --accent:#fb7185; --bg:#fbf2f6;}
  *{box-sizing:border-box}
.wrap{max-width:1080px;margin:22px auto 72px;padding:0 18px}
.block-title{display:flex;align-items:baseline;gap:10px;margin:6px 2px 14px}
.block-title h2{margin:0;font-size:20px;color:var(--primary)}
.block-title em{font-style:normal;font-size:12px;color:var(--accent-ink);background:var(--accent-line);border-radius:999px;padding:1px 10px}
.exam{border:1px solid var(--accent-line);border-radius:16px;background:var(--xz-surface);padding:18px 20px 16px;margin-bottom:18px;box-shadow:0 4px 14px -12px rgba(190,24,93,.5)}
.exam-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.exam-top h3{margin:0;font-size:19px;color:var(--primary)}
.exam-top .no{font-size:11px;background:var(--primary2);color:var(--xz-surface);border-radius:999px;padding:1px 10px;letter-spacing:.05em}
.exam-top .state{font-size:11.5px;color:var(--accent-ink)}
.exam-desc{font-size:12.5px;color:var(--xz-ink-3);margin:2px 0 12px}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.part{border:1px solid var(--accent-line);border-radius:13px;padding:13px 15px;text-decoration:none;color:inherit;background:linear-gradient(180deg,var(--xz-surface), var(--xz-surface-2));transition:transform .12s,box-shadow .12s,border-color .12s;display:block}
.part:hover{transform:translateY(-2px);box-shadow:0 12px 24px -16px rgba(190,24,93,.6);border-color:var(--accent)}
.part b{display:flex;align-items:center;gap:7px;font-size:15.5px;color:var(--primary)}
.part b .pi{width:26px;height:26px;flex:none;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:var(--xz-surface);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.part span{display:block;font-size:12px;color:var(--xz-ink-3);margin-top:5px;line-height:1.6}
.part .cnt{display:inline-block;margin-top:8px;font-size:11px;color:var(--accent-ink);background:var(--accent-line);border-radius:999px;padding:0 9px}
.guide{border:1px dashed var(--accent);border-radius:16px;background:var(--xz-surface-2);padding:16px 20px;margin-top:6px}
.guide h3{margin:0 0 8px;font-size:15px;color:var(--primary)}
.guide ol{margin:0;padding-left:20px;font-size:13px;color:var(--xz-ink-2)}
.guide li{margin:3px 0}
.guide code{background:var(--accent-line);color:var(--accent-ink);border-radius:5px;padding:0 6px;font-size:12px}
.guide .tpl{margin-top:10px;background:var(--xz-surface-2);border:1px solid var(--accent-line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--accent-ink);line-height:1.7}
@media(max-width:720px){
.wrap{padding:0 12px}
.exam{padding:14px 14px 12px}
}
.exam.ws-hit{outline:2px solid var(--primary2);outline-offset:2px;background:color-mix(in srgb,var(--primary2) 7%,var(--xz-surface))}
html.xz-dark .exam.ws-hit{background:color-mix(in srgb,var(--primary2) 20%,var(--xz-surface))}
</style>

</head>
<body>
<header>
  <h1>每周模考</h1>
  <div class="intro">整卷模考的复盘归档中心：按「期次」分册，每期下设行测、申论、行测错题集合、成绩分析四大入口；行测与错题集合内按政治理论、常识判断、言语理解、数量关系、判断推理、资料分析六类分置题目（与试卷部分顺序一致），成绩分析把成绩表与错题集合对齐，给出模块强弱与下一阶段补什么。</div>
  <div class="meta">
    <span id="mkCount">当前 2 期</span>
    <span>一期四入口</span>
    <span>六分类分置</span>
    <span>支持续增期次</span>
  </div>
</header>
<div class="wrap" id="wrap"></div>

<script>
/* ================= 期次登记表 =================
   新增一期模考时：在本数组最前面 push 一项，并参照 9月7日模考 建立同名文件夹，
   内含 行测.html / 申论.html / 行测错题集合.html / 成绩分析.html 四个页面即可自动出现在下方。
   命名规范：M月D日模考，例如 10月7日模考、11月20日模考。
   文件夹路径：sections/每周模考/<期次名>/                                      */
/* 【需求】期次登记表是“新增一期模考”的唯一入口：在数组最前面 push 一项，
   再建同名文件夹（内含 行测.html / 申论.html / 行测错题集合.html）即可自动出现在列表里。
   【易错】render() 把这些字段直接拼进 innerHTML 与 href（没有转义）：
   期次名里若出现空格、引号、斜杠会让链接失效，命名请严格用「M月D日模考」。 */
var MOCK_DATES = [
  { t:'9月22日模考', no:'第 3 期', state:'行测 130 题已录入 · 错题已分置 · 成绩已分析',
    desc:'2026 年 9 月 22 日整卷模考（行测模考卷五 + 申论·执法服务“点线面”）。行测 130 题（六大板块，含第 76～85 题图形原图）与申论 5 大题（材料 5 则）已录入题本，行测答案与解析、申论参考答案与评分标准（含第五题框架表与参考范文）均已按官方版本补全；本次 46 道错题与 3 道「不确定但答对」的侥幸题已按六大板块沉淀；两科成绩表（总分 / 行测 / 申论 + 行测九模块）已入站，成绩分析给出班级 / 行测同分段 / 年级行测榜三套基准、《46 道错题去向》与《申论补 3–5 分名次情景测算》。',
    qc:'130 题 · 含答案解析', sc:'5 大题 · 含评分标准', cc:'46 道错题 + 3 侥幸题', cj:'总分 126.3 · 年级 220' },
  { t:'9月18日模考', no:'第 2 期', state:'答案已录入 · 错题已分置 · 成绩已分析',
    desc:'2026 年 9 月 18 日整卷模考。行测 120 题（六大板块）与申论 5 大题已录入题本，行测答案与解析、申论参考答案与评分标准均已按官方版本补全；本次 37 道错题已按六大板块沉淀；两科成绩表（行测九模块 + 申论，合并 252 人）已入站，成绩分析给出年级榜 / 本班 / 行测同分段三套基准与申论情景测算。',
    qc:'120 题 · 含答案解析', sc:'5 大题 · 含评分标准', cc:'37 道错题', cj:'总分 134.2 · 年级 126' },
  { t:'9月7日模考', no:'第 1 期', state:'行测申论已录入 · 答案点击展开',
    desc:'2026 年 9 月 7 日整卷模考复盘。先补录行测六大分类题目，再做申论复盘，错题统一沉淀。',
    qc:'130 题已录入', sc:'5 大题已录入', cc:'六分类空槽', cj:'待成绩表入站' }
];

var SIX = [
  { c:'政治理论',  s:'习思想 · 马克思主义基本原理' },
  { c:'常识判断',  s:'文史 · 科技 · 经济 · 地理 · 法律' },
  { c:'言语理解',  s:'片段阅读 · 逻辑填空' },
  { c:'数量关系',  s:'数学运算 · 速算' },
  { c:'判断推理',  s:'图形 · 定义 · 类比 · 逻辑' },
  { c:'资料分析',  s:'统计材料 · 速算体系' }
];
var SIX_STR = SIX.map(function(x){ return x.c; }).join(' / ');

function render(){
  var html = '<div class="block-title"><h2>期次列表</h2><em>共 ' + MOCK_DATES.length + ' 期</em></div>';
  MOCK_DATES.forEach(function(m){
    html += '<div class="exam"><div class="exam-top"><h3>' + m.t + '</h3>' +
            '<span class="no">' + m.no + '</span><span class="state">' + (m.state || '行测申论已录入 · 答案点击展开') + '</span></div>' +
            '<div class="exam-desc">' + m.desc + '</div><div class="parts">' +
            '<a class="part" href="每周模考/' + m.t + '/行测.html"><b><span class="pi">测</span>行测</b>' +
            '<span>整卷行测题目，按六大板块分类排布：' + SIX_STR + '。每题保留卷面原图，答案解析折叠于题下。</span><span class="cnt">' + (m.qc || '题本已录入') + '</span></a>' +
            '<a class="part" href="每周模考/' + m.t + '/申论.html"><b><span class="pi">论</span>申论</b>' +
            '<span>申论整卷：给定资料与 5 道大题均已文字化，参考答案、评分标准与范文折叠于每题下方。</span><span class="cnt">' + (m.sc || '题本已录入') + '</span></a>' +
            '<a class="part" href="每周模考/' + m.t + '/行测错题集合.html"><b><span class="pi">错</span>行测错题集合</b>' +
            '<span>本卷错题按六大板块分类沉淀，每题记录错因与复盘。</span><span class="cnt">' + (m.cc || '六分类空槽') + '</span></a>' +
            '<a class="part" href="每周模考/' + m.t + '/成绩分析.html"><b><span class="pi">析</span>成绩分析</b>' +
            '<span>把本期成绩表与错题集合对齐：总分位置、模块强弱、失分去向与下一阶段补什么。</span><span class="cnt">' + (m.cj || '待录入') + '</span></a>' +
            '</div></div>';
  });
  html += '<div class="guide"><h3>如何新增一期模考（例如 10月7日模考、11月20日模考）</h3>' +
    '<ol><li>对工作站助手说「新增 10月7日模考」即可自动生成该期文件夹与四个页面；</li>' +
    '<li>或手动复制 <code>9月7日模考</code> 文件夹，改名为新期次（如 <code>10月7日模考</code>）后清空内容；</li>' +
    '<li>题图素材放入对应分类文件夹：<code>行测_assets/分类名/</code> 与 <code>行测错题集合_assets/分类名/</code>、<code>申论_assets/</code>；</li>' +
    '<li>在本页 <code>MOCK_DATES</code> 数组顶部 push 一条期次信息即可出现在上方列表中。</li></ol>' +
    '<div class="tpl">素材放置约定：每期目录下，行测_assets 与行测错题集合_assets 均内含政治理论/常识判断/言语理解/数量关系/判断推理/资料分析六个分类子文件夹，题目图片按题型放入后，再让助手写入对应页面（题目卡自带答案与解析，错题卡自带错因与复盘）。</div></div>';
  document.getElementById('wrap').innerHTML = html;
  var cntEl = document.getElementById('mkCount');
  if(cntEl){ cntEl.textContent = '当前 ' + MOCK_DATES.length + ' 期'; }
}
render();

/* 顶部全局搜索落点：进入本页后若有关键词，高亮期次卡片 */
/* 【接口】外壳搜索落点：收到 {type:'ws-search', q} 时高亮命中的期次卡片并滚过去（本页不跳转）。
   【坑】高亮曾经用写死的内联色（背景 #fff / #fff5f8）：夜间模式会把卡片刷成白块，
   而且下一次搜索前回不到原样式；现在改成 .ws-hit 类名，颜色交给主题变量。 */
window.addEventListener('message', function(e){
  var d = e.data || {};
  if(d.type === 'ws-search' && d.q){
    var q = String(d.q || '').trim();
    if(!q) return;
    document.querySelectorAll('.exam').forEach(function(card){
      var hit = card.textContent.indexOf(q) > -1;
      card.classList.toggle('ws-hit', hit);
      if(hit){ card.scrollIntoView({ behavior:'smooth', block:'center' }); }
    });
  }
});
</script>
</body>
</html>
